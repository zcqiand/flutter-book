name: guard_lab
description: ch17 单应用：全局异常三层兜底与本地持久化三件套同仓演练，离线可跑
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # 三件套版本行由 flutter pub add 实锁，实测回执见清单 17-9
  shared_preferences: ^2.5.6
  sqflite: ^2.4.4+2
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true