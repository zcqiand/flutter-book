name: dio_lab
description: ch14 单应用——文章列表三态页，数据来自拦截器层本地 mock，离线可跑
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # 版本行以 flutter pub add 实测锁定值为准
  dio: ^5.11.1
  json_annotation: ^4.12.0
  # 生成客户端（lib/generated/）的传递依赖（built_value 系），
  # 以生成器临时包 pubspec 的约束为准，版本对齐案例仓锁定值
  built_collection: 5.1.2
  built_value: 8.13.0
  one_of: 1.5.0
  one_of_serializer: 1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.14.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
